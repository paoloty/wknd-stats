<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WKND League Stats</title>
    <meta name="theme-color" content="#0b0f19">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script>
        (function () {
            try {
                var rawHost = String(window.location.hostname || '').toLowerCase();
                var normalizedHost = rawHost.replace(/\.$/, '').replace(/^www\./, '');
                var isLocalLike = (
                    normalizedHost === 'localhost'
                    || normalizedHost === '127.0.0.1'
                    || normalizedHost === '::1'
                    || normalizedHost.endsWith('.local')
                );
                if (isLocalLike) return;

                fetch('/api/client-config', { cache: 'no-store' })
                    .then(function (res) { return res.ok ? res.json() : null; })
                    .then(function (config) {
                        var enabled = !!(config && config.gaEnabled);
                        var measurementId = String((config && config.gaMeasurementId) || '').trim();
                        if (!enabled || !measurementId) return;

                        window.__WKND_GA_MEASUREMENT_ID = measurementId;
                        window.dataLayer = window.dataLayer || [];
                        window.gtag = window.gtag || function gtag() { window.dataLayer.push(arguments); };

                        var existing = document.querySelector('script[data-ga-script="1"]');
                        if (!existing) {
                            var script = document.createElement('script');
                            script.async = true;
                            script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(measurementId);
                            script.setAttribute('data-ga-script', '1');
                            document.head.appendChild(script);
                        }

                        window.gtag('js', new Date());
                        window.gtag('config', measurementId, { send_page_view: false });
                    })
                    .catch(function () {});
            } catch (e) {}
        })();
    </script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19; /* Darker Midnight Slate */
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        /* Animated pulsing ring for armed action state */
        @keyframes targetPulse {
            0%, 100% { border-color: rgba(16, 185, 129, 0.4); box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.2); }
            50% { border-color: rgba(16, 185, 129, 0.9); box-shadow: 0 0 10px 3px rgba(16, 185, 129, 0.4); }
        }
        .armed-target {
            animation: targetPulse 1.8s infinite ease-in-out;
            cursor: pointer;
        }
        /* Soft glow on the likely-possession team's on-court container while an action is armed */
        @keyframes possessionGlow {
            0%, 100% { border-color: rgba(16, 185, 129, 0.35); box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.2); }
            50% { border-color: rgba(16, 185, 129, 0.85); box-shadow: 0 0 20px 3px rgba(16, 185, 129, 0.35); }
        }
        .possession-glow {
            animation: possessionGlow 1.8s infinite ease-in-out;
        }
        /* Quick attention shake for the armed-action recording banner popping in */
        @keyframes bannerShakeIn {
            0% { transform: translateX(0); }
            15% { transform: translateX(-6px); }
            30% { transform: translateX(5px); }
            45% { transform: translateX(-4px); }
            60% { transform: translateX(3px); }
            75% { transform: translateX(-1.5px); }
            100% { transform: translateX(0); }
        }
        .banner-shake-in {
            animation: bannerShakeIn 400ms ease-in-out;
        }
        @keyframes leaderBarGrow {
            from { transform: scaleX(0); opacity: 0.45; }
            to { transform: scaleX(1); opacity: 1; }
        }
        .leader-bg-fill {
            animation: leaderBarGrow 700ms ease-out both;
        }
        .leader-bg-fill-left {
            transform-origin: right center;
        }
        .leader-bg-fill-right {
            transform-origin: left center;
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>
    <!-- Persistence now handled by Node + SQLite backend APIs -->

        <script src="/app.bundle.js?v=20260615-state-payload-fix-29"></script>
        <script>
            // Temporarily disable service worker caching to avoid stale runtime behavior
            // while live-session persistence issues are being stabilized.
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.getRegistrations()
                        .then(function (registrations) {
                            return Promise.all((registrations || []).map(function (registration) {
                                return registration.unregister();
                            }));
                        })
                        .then(function () {
                            if (!window.caches || typeof window.caches.keys !== 'function') return [];
                            return window.caches.keys().then(function (keys) {
                                return Promise.all((keys || []).map(function (key) {
                                    return window.caches.delete(key);
                                }));
                            });
                        })
                        .catch(function () {});
                });
            }
        </script>
        <script>
            (function () {
                function parseStatsFromPotgCard(card) {
                    var stats = { pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, to: 0 };
                    var labels = card.querySelectorAll('div.text-\[9px\].uppercase');
                    labels.forEach(function (labelNode) {
                        var label = (labelNode.textContent || '').trim().toUpperCase();
                        var valueNode = labelNode.parentElement ? labelNode.parentElement.querySelector('div.mt-1') : null;
                        var value = Number.parseInt(((valueNode && valueNode.textContent) || '0').replace(/[^0-9-]/g, ''), 10);
                        if (!Number.isFinite(value)) value = 0;
                        if (label === 'PTS') stats.pts = value;
                        if (label === 'REB') stats.reb = value;
                        if (label === 'AST') stats.ast = value;
                        if (label === 'STL') stats.stl = value;
                        if (label === 'BLK') stats.blk = value;
                        if (label === 'TO') stats.to = value;
                    });
                    return stats;
                }

                function normalizeName(value) {
                    return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
                }

                function findPlayerByPotgLine(teamA, teamB, potgLine, teamNameHint) {
                    var line = String((potgLine && potgLine.textContent) || '').trim();
                    var numberMatch = line.match(/^#\s*([^\s]+)/);
                    var jersey = numberMatch ? String(numberMatch[1]).trim() : '';
                    var playerName = line.replace(/^#\s*[^\s]+\s*/, '').trim();
                    var badge = potgLine.querySelector('span');
                    if (badge && badge.textContent) {
                        playerName = playerName.replace(badge.textContent.trim(), '').trim();
                    }

                    var teams = [teamA, teamB].filter(Boolean);
                    if (teamNameHint) {
                        teams.sort(function (a, b) {
                            var am = String((a && a.name) || '').trim().toLowerCase() === teamNameHint ? 1 : 0;
                            var bm = String((b && b.name) || '').trim().toLowerCase() === teamNameHint ? 1 : 0;
                            return bm - am;
                        });
                    }

                    var wanted = normalizeName(playerName);
                    for (var t = 0; t < teams.length; t += 1) {
                        var team = teams[t];
                        var players = Array.isArray(team.players) ? team.players : [];
                        for (var i = 0; i < players.length; i += 1) {
                            var p = players[i];
                            var jerseyOk = !jersey || String(p.number || '').trim() === jersey;
                            if (!jerseyOk) continue;
                            if (!wanted) return { player: p, team: team };
                            if (normalizeName(p.name) === wanted || normalizeName(p.name).indexOf(wanted) >= 0 || wanted.indexOf(normalizeName(p.name)) >= 0) {
                                return { player: p, team: team };
                            }
                        }
                    }
                    return null;
                }

                async function generatePotgWriteup(button, potgCard, textNode) {
                    var gameCard = button.closest('div.bg-slate-900.border.border-slate-800.rounded-2xl');
                    if (!gameCard) return;

                    var matchIdNode = Array.from(gameCard.querySelectorAll('span')).find(function (node) {
                        return (node.textContent || '').indexOf('Match ID:') >= 0;
                    });
                    var gameId = matchIdNode ? String(matchIdNode.textContent).replace('Match ID:', '').trim() : '';
                    if (!gameId) {
                        alert('Could not find Match ID for this game card.');
                        return;
                    }

                    var role = String(localStorage.getItem('wknd_access_role') || 'viewer');
                    if (role === 'viewer') {
                        alert('Login as operator/admin first to regenerate POTG writeup.');
                        return;
                    }

                    button.disabled = true;
                    var oldLabel = button.textContent;
                    button.textContent = 'Generating POTG Writeup...';

                    try {
                        var stateRes = await fetch('/api/state', { cache: 'no-store' });
                        var state = await stateRes.json();
                        var games = Array.isArray(state.games) ? state.games : [];
                        var teams = Array.isArray(state.teams) ? state.teams : [];
                        var game = games.find(function (g) { return String(g.id) === gameId; });
                        if (!game) throw new Error('Game not found in server state.');

                        var teamA = teams.find(function (t) { return String(t.id) === String(game.teamAId); });
                        var teamB = teams.find(function (t) { return String(t.id) === String(game.teamBId); });

                        var potgLine = potgCard.querySelector('div.text-sm.font-extrabold.text-white');
                        var badge = potgLine ? potgLine.querySelector('span') : null;
                        var teamNameHint = badge ? String(badge.textContent || '').trim().toLowerCase() : '';
                        var resolved = findPlayerByPotgLine(teamA, teamB, potgLine, teamNameHint);
                        if (!resolved || !resolved.player) throw new Error('Could not resolve POTG player from card.');

                        var stats = parseStatsFromPotgCard(potgCard);
                        var payload = {
                            game: {
                                id: game.id,
                                date: game.date,
                                teamAId: game.teamAId,
                                teamBId: game.teamBId,
                                teamAName: game.teamAName,
                                teamBName: game.teamBName,
                                teamAScore: Number(game.teamAScore || 0),
                                teamBScore: Number(game.teamBScore || 0)
                            },
                            playerOfTheGame: {
                                id: resolved.player.id,
                                name: resolved.player.name,
                                number: resolved.player.number,
                                teamId: resolved.team.id,
                                teamName: resolved.team.name,
                                stats: stats
                            }
                        };

                        var writeupRes = await fetch('/api/generate-potg-writeup', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        var writeupJson = await writeupRes.json();
                        if (!writeupRes.ok) throw new Error(writeupJson.error || 'Failed to generate POTG writeup.');
                        var writeup = String(writeupJson.writeup || '').trim();
                        if (!writeup) throw new Error('Generated POTG writeup is empty.');

                        textNode.textContent = writeup;

                        var updatedGames = games.map(function (g) {
                            if (String(g.id) !== String(game.id)) return g;
                            var next = Object.assign({}, g);
                            next.potgWriteup = writeup;
                            return next;
                        });

                        await fetch('/api/state', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ teams: teams, games: updatedGames })
                        });

                        button.textContent = 'Regenerate POTG Writeup';
                    } catch (err) {
                        alert((err && err.message) ? err.message : 'Failed to regenerate POTG writeup.');
                        button.textContent = oldLabel;
                    } finally {
                        button.disabled = false;
                    }
                }

                function injectPotgButtons() {
                    var potgCards = Array.from(document.querySelectorAll('div.rounded-xl.p-4.border.border-slate-800'))
                        .filter(function (node) {
                            return node.classList && node.classList.contains('bg-slate-950/70');
                        });
                    potgCards.forEach(function (card) {
                        var title = card.querySelector('div.text-\[10px\].uppercase');
                        if (!title || String(title.textContent || '').trim().toLowerCase() !== 'player of the game') return;

                        var textNode = card.querySelector('div.text-\[11px\].text-slate-400.mt-1');
                        if (!textNode) return;
                        if (card.querySelector('[data-potg-fallback-btn="1"]')) return;

                        var role = String(localStorage.getItem('wknd_access_role') || 'viewer');
                        var hasWriteup = String(textNode.textContent || '').trim() && String(textNode.textContent || '').toLowerCase().indexOf('per-style game rating') < 0;

                        var wrap = document.createElement('div');
                        wrap.className = 'mt-2';

                        var button = document.createElement('button');
                        button.type = 'button';
                        button.setAttribute('data-potg-fallback-btn', '1');
                        button.className = 'w-full sm:w-auto px-3 py-1.5 rounded-lg text-xs font-bold border border-cyan-500/40 bg-cyan-500/15 text-cyan-200 hover:bg-cyan-500/25 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed';
                        button.textContent = role === 'viewer'
                            ? 'Login to Generate POTG Writeup'
                            : (hasWriteup ? 'Regenerate POTG Writeup' : 'Generate POTG Writeup');

                        button.addEventListener('click', function () {
                            generatePotgWriteup(button, card, textNode);
                        });

                        wrap.appendChild(button);
                        textNode.insertAdjacentElement('afterend', wrap);
                    });
                }

                var observer = new MutationObserver(function () { injectPotgButtons(); });
                observer.observe(document.documentElement, { childList: true, subtree: true });
                document.addEventListener('DOMContentLoaded', injectPotgButtons);
                window.addEventListener('load', injectPotgButtons);
                setInterval(injectPotgButtons, 1200);
            })();
        </script>

</body>
</html>
